# Nginx: única puerta de entrada (sección 7 del PDF).
# Sirve la web y reenvía /api/<servicio>/ al servicio correspondiente.
# payments y notifications NO se exponen hacia afuera.
# Instalado por infra/scripts/setup-server.sh en /etc/nginx/sites-available/entradasya

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    # Web (React compilado)
    root /var/www/entradasya;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # Cabeceras comunes hacia los servicios
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Internal-Token  "";   # nadie de afuera puede hacerse pasar por un servicio
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Las rutas /internal/ son solo para llamadas entre servicios
    location ~ ^/api/[a-z]+/internal/ { return 404; }

    location = /api/auth    { proxy_pass http://127.0.0.1:3001/; }
    location /api/auth/     { proxy_pass http://127.0.0.1:3001/; }

    location = /api/events  { proxy_pass http://127.0.0.1:3002/; }
    location /api/events/   { proxy_pass http://127.0.0.1:3002/; }

    location = /api/orders  { proxy_pass http://127.0.0.1:3003/; }
    location /api/orders/   { proxy_pass http://127.0.0.1:3003/; }

    location = /api/tickets { proxy_pass http://127.0.0.1:3005/; }
    location /api/tickets/  { proxy_pass http://127.0.0.1:3005/; }

    location = /api/checkin { proxy_pass http://127.0.0.1:3007/; }
    location /api/checkin/  { proxy_pass http://127.0.0.1:3007/; }

    # Mailpit (correo de prueba) en http://IP/mailpit/
    location /mailpit/ {
        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
